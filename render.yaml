# Review Radar — Render deployment config
# Deploy this repo as a Render web service.
#
# Required env vars (set in Render dashboard — NOT in this file):
#   OPENROUTER_API_KEY — OpenRouter API key for Claude Haiku narrative
#   ALLOWED_ORIGINS    — Comma-separated allowed origins, e.g.:
#                        https://your-site.netlify.app,http://localhost:3000

services:
  - type: web
    name: review-radar-api
    runtime: python
    rootDir: backend
    # Install CPU-only PyTorch FIRST from the CPU wheel index, so the transitive
    # torch dependency from keybert/sentence-transformers is already satisfied and
    # pip does NOT pull the ~2GB CUDA/GPU build (useless on Render's CPU instances,
    # and slow enough to import that cold starts miss the port-bind deadline).
    buildCommand: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    # audit-added: reference the existing GET /health endpoint for application-level
    # health monitoring. Without this, Render only checks TCP port binding and will
    # not restart a process that has crashed-but-not-exited.
    healthCheckPath: /health
    # audit-added: Free tier spins down after 15 min idle → 30-60s cold start on
    # next request. This directly conflicts with the "insights in under 30 seconds"
    # product promise. Document as known limitation; upgrade plan to eliminate.
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GOSOM_API_URL
        sync: false
        # Set to http://review-radar-gosom:8080 (Render internal DNS, paid plan Private Service)
        # Or the public gosom service URL if on free tier (document as known risk)
      - key: OUTSCRAPER_API_KEY
        sync: false
        # Optional — only required if Outscraper fallback is enabled.
        # Leave unset to disable fallback (gosom-only mode).
        # Get key from: https://app.outscraper.com/api-key
      - key: N8N_WEBHOOK_SECRET
        sync: false
        # Shared secret between Render and n8n Cloud.
        # Set in both Render dashboard and n8n workflow HTTP node headers.
        # Generate: python -c "import secrets; print(secrets.token_urlsafe(32))"

  # gosom scraper service — Dockerised, runs REST API for competitor review scraping
  # Phase 3 plan 03-01. See gosom/Dockerfile for access control requirements.
  - type: web
    name: review-radar-gosom
    runtime: docker
    dockerfilePath: ./gosom/Dockerfile
    # ACCESS CONTROL — see gosom/Dockerfile header for full guidance.
    # Paid plan: set visibility to "Private" in Render dashboard → internal-only access.
    # Free plan: public URL (known risk — migrate before commercial launch).
    envVars:
      - key: PORT
        value: "8080"
